name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install pyinstaller
      
      - name: Download FFmpeg
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath .
          Move-Item ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe .
          Move-Item ffmpeg-master-latest-win64-gpl\bin\ffprobe.exe .
      
      - name: Build EXE
        run: |
          pyinstaller --onefile --name "SilenceRemover" --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." silence_remover.py
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilenceRemover-Windows
          path: dist/SilenceRemover.exe
